<script>
document.addEventListener('DOMContentLoaded', function() {
    var tags = {};
    var maxCount = 0;
    
    
    if(!tags['documentation']) tags['documentation'] = 0;
    tags['documentation']++;
    if(tags['documentation'] > maxCount) maxCount = tags['documentation'];
    
    
    var cloud = document.getElementById('tagcloud');
    if(cloud) {
        var html = '';
        for(var t in tags) {
            var weight = maxCount > 1 ? (tags[t] - 1) / (maxCount - 1) : 0.5;
            var size = 10 + weight * 10;
            html += '<a href="https://gjayvee.github.io/tag.html#' + encodeURI(t) + '" style="font-size:' + size.toFixed(1) + 'px">' + t + '</a> ';
        }
        cloud.innerHTML = html;
    }
});
</script>
