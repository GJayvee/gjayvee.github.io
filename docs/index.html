<!DOCTYPE html>
<html lang=zh>
<head>
    <meta charset=utf-8>
    <meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=5">
    <meta name=description content="我是Jayvee 这是我的博客分享我的经历与感悟">
    
    <link rel="shortcut icon" href="https://raw.githubusercontent.com/GJayvee/gjayvee.github.io/refs/heads/main/pingu_picture.webp">
    <link rel=icon type=image/png href="https://raw.githubusercontent.com/GJayvee/gjayvee.github.io/refs/heads/main/pingu_picture.webp" sizes=192x192>
    <title>Jayvee Blog</title>
    <link rel=stylesheet href=/css/style.css>
    <link rel=stylesheet href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
<style>
.tagcloud a{display:inline-block;margin:5px;color:#ebdbb2;text-decoration:none}
.tagcloud a:hover{color:#fe8019}
.project-list{padding:0;list-style:none}
.project-list .project-item{margin-bottom:5px}
.project-list .project-item p{display:inline}
</style>

    
<meta property=og:type content=website>
<meta property=og:title content="Jayvee Blog">
<meta property=og:url content="https://gjayvee.github.io">


</head>
<body class="max-width mx-auto px3 ltr">
<div class="content index py4 h-card">
    <header id=header>
        <a class="u-url u-uid" href="https://gjayvee.github.io">
            <img id=logo alt class=u-logo src="https://raw.githubusercontent.com/GJayvee/gjayvee.github.io/refs/heads/main/pingu_picture.webp">
            <div id=title><h1 class=p-name>Jayvee Blog</h1></div>
        </a>
        <div id=nav>
            <ul>
                <li class=icon><a href=# aria-label=菜单><i class="fa-solid fa-bars fa-2x"></i></a></li>
                <li><a href="https://gjayvee.github.io">首页</a></li>
                
                
                <li><a href="https://gjayvee.github.io/tag.html">标签</a></li>
            </ul>
        </div>
    </header>
    <section id=about class=p-note><p>我是Jayvee 这是我的博客分享我的经历与感悟</p></section>
    
<section id=writing>
    <span class=h1><a href="https://gjayvee.github.io">文章</a></span>
    <span class=h2>标签</span>
    <span class="widget tagcloud"></span>
    <span class=h2>最新发布</span>
    <ul class=post-list>
    
        <li class=post-item>
            <div class=meta><time datetime="2026-06-07">2026-06-07</time></div>
            <span><a href="post/jayvee-ce-shi.html">jayvee测试</a></span>
        </li>
    
    </ul>
    
</section>

    <footer id=footer>
        <div class=footer-left>Copyright &copy; <span id="copyrightYear"></span> Jayvee Blog</div>
        <div class=footer-right>
            <nav><ul>
                <li><a href="https://gjayvee.github.io">首页</a></li>
                <li><a href="https://gjayvee.github.io/tag.html">标签</a></li>
            </ul></nav>
        </div>
    </footer>
</div>
<script src=/js/main.js></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var tags = {};
    
    
    if(!tags['documentation']) tags['documentation'] = 0;
    tags['documentation']++;
    
    
    var cloud = document.querySelector('.tagcloud');
    if(cloud) {
        var html = '';
        for(var t in tags) {
            html += '<a href="https://gjayvee.github.io/tag.html#' + encodeURI(t) + '">' + t + '</a> ';
        }
        cloud.innerHTML = html;
    }
});
</script>


<script>
document.getElementById("copyrightYear").innerHTML = new Date().getFullYear();
</script>
</body>
</html>
